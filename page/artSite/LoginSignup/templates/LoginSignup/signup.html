{% extends "artApp/base.html" %}
{% block main-content %}
<div class="form-container">
    <h2>Sign Up</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="form-link">
        Already have an account? <a href="{% url "login" %}">Login</a>
    </p>
</div>
{% endblock main-content %}
