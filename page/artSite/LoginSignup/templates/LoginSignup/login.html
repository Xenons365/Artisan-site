{% extends "artApp/base.html" %}
{% block main-content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="form-link">
        Don't have an account? <a href="{% url "signup" %}">Sign Up</a>
    </p>
</div>
{% endblock main-content %}
